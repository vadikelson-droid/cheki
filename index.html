<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://generativelanguage.googleapis.com https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffd91a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140d" media="(prefers-color-scheme: dark)">
<title>Чек на стол</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/192.png">
<link rel="apple-touch-icon" href="icons/192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app" aria-live="polite"></main>
<input id="shot" type="file" accept="image/*" capture="environment" hidden>
<input id="pick" type="file" accept="image/*,application/pdf" multiple hidden>
<input id="load" type="file" accept="application/json,.json" hidden>
<nav aria-label="Разделы">
<button data-tab="check" aria-current="page"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Чек</button>
<button data-tab="buy"><svg viewBox="0 0 24 24"><path d="M2 4h3l2.5 11h10L20 8H6M9 20h.01M17 20h.01"/></svg>Купить<span class="badge" id="badge" hidden></span></button>
<button data-tab="cook"><svg viewBox="0 0 24 24"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h20M9 6V3M15 6V3"/></svg>Кухня</button>
<button data-tab="spend"><svg viewBox="0 0 24 24"><path d="M4 20V11h4v9M10 20V4h4v16M16 20v-6h4v6"/></svg>Траты</button>
<button data-tab="price"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 7zM7.5 8h.01"/></svg>Цены</button>
</nav>
<script src="idb.js"></script>
<script src="app.js"></script>
</body>
</html>
